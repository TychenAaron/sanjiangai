# 本文件仅用于 Windows 本机开发时初始化和检查本地 D1 数据库。
# 所有命令都必须显式携带 --local，严禁把本文件用于生产部署或线上数据库操作。

name = "sanjiang-ai-workbench-local"
main = "./worker/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "site-creator-d1"
database_id = "00000000-0000-4000-8000-000000000000"
migrations_dir = "drizzle"

# 公文私有参考材料仅在 Miniflare local R2 中保存原文件，不能连接或复用线上、公共资料库的对象存储。
[[r2_buckets]]
binding = "WRITING_REFERENCES_BUCKET"
bucket_name = "sanjiang-writing-references-local"
